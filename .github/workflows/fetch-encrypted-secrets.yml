name: Fetch Encrypted Secrets

on:
  workflow_call:
    inputs:
      zip_url_json:
        required: false
        type: string
        default: ''

jobs:
  download-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (secrets.zip committed in-repo)
        uses: actions/checkout@v4

      - name: Verify secrets.zip present
        run: test -f secrets.zip

      - name: Upload Encrypted Artifact
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-secrets-zip
          path: secrets.zip
          retention-days: 1
